[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "AZPytest"
version = "0.1.0"
description = "Tick-data backtesting toolkit: replay a CSV, simulate long/short trades, and run price analytics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "vxvira" }]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/vxvira/AZPytest"

[tool.setuptools.packages.find]
include = ["AZPytest*"]
